<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RL Study Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a study desk. Sticky header with progress, tabbed views, one column of item rows that expand in place. */
  --bg:#f3f4f0; --surface:#ffffff; --ink:#1b211f; --muted:#5d6762; --line:#dde1dc;
  --accent:#2f47c9; --accent-soft:#e7eafb; --good:#1f7a4d; --warn:#a86200; --bad:#b3261e;
  --display:"Newsreader",Georgia,serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --chipL:48%; --chipS:62%; --chipBg:90%; --chipFg:27%;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a201d; --ink:#e7ebe8; --muted:#9aa49f; --line:#2c3430;
  --accent:#8fa0ff; --accent-soft:#252c4d; --good:#5cc68f; --warn:#e3a647; --bad:#ff8a80; --chipL:62%; --chipS:38%; --chipBg:24%; --chipFg:80%; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a201d; --ink:#e7ebe8; --muted:#9aa49f; --line:#2c3430;
  --accent:#8fa0ff; --accent-soft:#252c4d; --good:#5cc68f; --warn:#e3a647; --bad:#ff8a80; --chipL:62%; --chipS:38%; --chipBg:24%; --chipFg:80%; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px;padding:16px 0 10px}
.brand h1{font:600 26px/1.1 var(--display);margin:0;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:18px;margin-left:auto}
.stat{min-width:84px}
.stat b{display:block;font:500 18px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
nav{display:flex;gap:2px;overflow-x:auto;padding-top:6px}
nav a{padding:8px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
main{padding:20px 0 60px}
h2{font:600 22px/1.2 var(--display);margin:0 0 4px;text-wrap:balance}
h3{font:600 16px/1.3 var(--body);margin:0}
.sub{color:var(--muted);margin:0 0 16px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;text-decoration:none;color:var(--ink);font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1020}}
.btn.small{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.ihead{display:grid;grid-template-columns:minmax(18px,auto) 1fr auto;gap:10px;align-items:center;padding:10px 12px}
.ihead input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0}
.ititle{min-width:0}
.ititle .t{font-weight:500;cursor:pointer;overflow-wrap:anywhere}
.ititle .t:hover{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:2px}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11.5px;font-weight:600;color:hsl(var(--h) 60% var(--chipFg));background:hsl(var(--h) var(--chipS) var(--chipBg));}
.kind{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.mins{font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.iacts{display:flex;gap:6px;align-items:center}
.item.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.detail{padding:4px 12px 14px 50px;display:flex;flex-direction:column;gap:10px}
.detail p{margin:0;max-width:68ch}
.detail ul,.detail ol{margin:0;padding-left:20px;max-width:68ch}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--bg);resize:vertical}
input[type=text],input[type=number],input[type=date],select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface)}
.player{position:relative;width:100%;max-width:760px;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.answer{white-space:pre-wrap;background:var(--bg);border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 6px 6px 0;max-width:72ch}
.conf{display:flex;flex-wrap:wrap;gap:6px}
.conf button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.q{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--bg)}
.q p{margin:0 0 8px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{text-align:left;border:1px solid var(--line);background:var(--surface);padding:6px 10px;border-radius:6px;cursor:pointer}
.opts button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.why{font-size:13px;color:var(--muted);margin-top:6px}
.section{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.section h3{font:600 17px/1.2 var(--display)}
.section span{color:var(--muted);font-size:13px}
.empty{padding:16px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);border-top:4px solid hsl(var(--h) 55% var(--chipL))}
.card:hover{border-color:var(--accent)}
.card .small{font-size:13px;color:var(--muted)}
.week{margin-bottom:10px}
.whead{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer;width:100%;text-align:left}
.whead .w1{flex:1;min-width:0}
.whead .w1 b{display:block}
.whead .w1 span{font-size:12.5px;color:var(--muted)}
.week.open .whead{border-radius:8px 8px 0 0;border-bottom-color:transparent}
.week.open .list{border-radius:0 0 8px 8px}
.day{padding:8px 12px 4px;font:500 12.5px var(--mono);color:var(--muted);background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-between}
.day.today{color:var(--accent)}
.pill{font:500 11px var(--mono);padding:2px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:currentColor}
.pill.warn{color:var(--warn);border-color:currentColor}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form .full{grid-column:1/-1}
.days{display:flex;flex-wrap:wrap;gap:8px}
.days label{flex-direction:row;align-items:center;gap:4px;color:var(--ink)}
.note{font-size:13px;color:var(--muted);max-width:72ch}
.sync{font-size:12px;color:var(--muted)}
.labhead{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;margin:6px 0 18px}
.pystatus{font:12.5px var(--mono);color:var(--muted)}
.step{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.step.passed{border-left:4px solid var(--good)}
.step h3{display:flex;gap:10px;align-items:baseline}
.step h3 .num{font:500 12px var(--mono);color:var(--muted)}
.step .text p{margin:0 0 8px;max-width:72ch}
.step .text code,.detail code{font:13px var(--mono);background:var(--bg);padding:1px 4px;border-radius:4px}
textarea.code{font:13px/1.5 var(--mono);background:var(--bg);min-height:120px;tab-size:4;white-space:pre;overflow:auto}
.out{font:12.5px/1.45 var(--mono);white-space:pre-wrap;background:var(--bg);border-radius:6px;padding:10px 12px;margin:0;max-height:320px;overflow:auto}
.out.err{border-left:3px solid var(--bad)}
.out.ok{border-left:3px solid var(--good)}
.figs img{max-width:100%;background:#fff;border-radius:6px;border:1px solid var(--line)}
.hint{font-size:14px;background:var(--accent-soft);border-radius:6px;padding:8px 12px}
pre.sol{font:12.5px/1.45 var(--mono);background:var(--bg);border-radius:6px;padding:10px 12px;margin:0;overflow:auto}
.notice{background:var(--accent-soft);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:14px}
@media (max-width:560px){.detail{padding-left:12px}.stats{margin-left:0}.top{align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><h1>RL Study Desk</h1><p id="trackline">11 NPTEL courses, one plan</p></div>
      <div class="stats">
        <div class="stat"><b id="s-pct">0%</b><span>complete</span></div>
        <div class="stat"><b id="s-hrs">0 / 0</b><span>hours done</span></div>
        <div class="stat"><b id="s-day">—</b><span>needed per day</span></div>
        <div class="stat"><b id="s-end">—</b><span>finish</span></div>
        <div class="stat"><b id="s-streak">0</b><span>day streak</span></div>
      </div>
    </div>
    <div class="bar" aria-hidden="true"><i id="s-bar" style="width:0"></i></div>
    <nav id="nav">
      <a href="#today">Today</a><a href="#plan">Plan</a><a href="#courses">Courses</a><a href="#projects">Projects</a><a href="#review">Review</a><a href="#setup">Setup</a>
    </nav>
  </div>
</header>
<main class="wrap" id="view"><p class="empty">Loading your curriculum…</p></main>

<script type="text/plain" id="pyworker">
importScripts("https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js");
let py = null;
const ready = loadPyodide().then(p => { py = p; });
const loaded = new Set(), spaces = {};
const HELP = `
import os, sys
os.environ["MPLBACKEND"] = "Agg"
def __grab_figs():
    if "matplotlib.pyplot" not in sys.modules:
        return []
    import io, base64
    import matplotlib.pyplot as plt
    out = []
    for n in plt.get_fignums():
        buf = io.BytesIO()
        plt.figure(n).savefig(buf, format="png", dpi=80, bbox_inches="tight")
        out.append(base64.b64encode(buf.getvalue()).decode())
    plt.close("all")
    return out
`;
onmessage = async (e) => {
  const {id, labId, code, packages, fresh, grab} = e.data;
  const out = [];
  try {
    if (!py) postMessage({id, status:"Loading Python…"});
    await ready;
    const need = (packages || []).filter(p => !loaded.has(p));
    if (need.length) { postMessage({id, status:"Loading " + need.join(", ") + "…"}); await py.loadPackage(need); need.forEach(p => loaded.add(p)); }
    if (fresh || !spaces[labId]) { if (spaces[labId]) spaces[labId].destroy(); spaces[labId] = py.globals.get("dict")(); await py.runPythonAsync(HELP, {globals: spaces[labId]}); }
    py.setStdout({batched: s => out.push(s)}); py.setStderr({batched: s => out.push(s)});
    postMessage({id, status:"Running…"});
    await py.runPythonAsync(code, {globals: spaces[labId]});
    let figs = [];
    if (grab) { const f = await py.runPythonAsync("__grab_figs()", {globals: spaces[labId]}); figs = f.toJs(); f.destroy(); }
    postMessage({id, ok:true, out:out.join("\n"), figs});
  } catch (err) {
    let figs = [];
    try { const f = await py.runPythonAsync("__grab_figs()", {globals: spaces[labId]}); figs = f.toJs(); f.destroy(); } catch (_) {}
    postMessage({id, ok:false, out:out.join("\n"), err:String(err && err.message || err), figs});
  }
};
</script>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const dow = s => parse(s).getDay();
const today = () => ymd(new Date());
const fmtDay = s => parse(s).toLocaleDateString(undefined,{weekday:"short", day:"numeric", month:"short"});
const fmtDate = s => parse(s).toLocaleDateString(undefined,{day:"numeric", month:"short", year:"numeric"});
const hm = m => m >= 60 ? `${Math.floor(m/60)}h${m%60 ? " "+(m%60)+"m" : ""}` : `${m}m`;
const yt = id => `https://www.youtube.com/watch?v=${id}`;
const KIND = {lec:"Lecture", read:"Reading", assign:"Assignment", task:"Practice", test:"Self-test", final:"Final exam", proj:"Project", ext:"Deep RL", habit:"Habit", lab:"Guided lab"};

/* ---------- state ---------- */
const LS_KEY = "rlstudy.v1";
const defaults = () => ({v:1, updated:0, settings:{start:today(), wd:90, we:180, pace:1.25, rest:[], track:"full", mode:"deadline", weeks:12}, done:{}, tests:{}, reviews:{}});
let S = defaults(), NOTES = {updated:0, n:{}};
let C = null, SEQ = [], BYID = {}, PLAN = null, DAILY = 0;
let open = new Set();       // expanded item ids
let openWeeks = new Set();  // expanded plan weeks
let syncMsg = "Saved in this browser only", EMBED = false;
try { const raw = localStorage.getItem(LS_KEY); if (raw) { const o = JSON.parse(raw); if (o.s) S = Object.assign(defaults(), o.s); if (o.n) NOTES = o.n; } } catch(e) {}
S.settings = Object.assign(defaults().settings, S.settings || {});

/* ---------- sequence ---------- */
function lecMin(c){ return Math.round(c.est * S.settings.pace); }
function buildSeq(){
  const track = S.settings.track, phases = track === "core" ? C.phases_core : C.phases_full;
  const inTrack = new Set(phases.flatMap(p => p[1]));
  const seq = [];
  const projs = C.projects.filter(p => (track === "full" || p.core) && (p.anchor === "start" || inTrack.has(p.anchor[0])));
  const pushProj = p => { for (let k = 1; k <= p.hours; k++) seq.push({id:`${p.id}-s${k}`, kind:"proj", p, k, title:`${p.title}`, min:60, phase:cur}); };
  let cur = "Python warm-up";
  C.warmup.forEach(id => seq.push({id:`L-${id}`, kind:"lab", lab:id, title:C.labs[id].title, min:60, phase:cur}));
  projs.filter(p => p.anchor === "start").forEach(pushProj);
  for (const [pname, codes] of phases){
    cur = pname;
    const maxW = Math.max(...codes.map(k => C.courses[k].weeks.length));
    for (let w = 1; w <= maxW; w++){
      for (const k of codes){
        const c = C.courses[k], wk = c.weeks[w-1];
        if (!wk) continue;
        const base = {c:k, w, phase:pname};
        wk.lectures.forEach((l,i) => seq.push({...base, id:`${k}-w${w}-l${i+1}`, kind:"lec", title:l[0], yt:l[1], min:lecMin(c)}));
        if (wk.reading) seq.push({...base, id:`${k}-w${w}-r`, kind:"read", title:`${wk.reading.ref}`, min:40});
        if (wk.assign.length) seq.push({...base, id:`${k}-w${w}-a`, kind:"assign", title:`Week ${w} assignment`, min:60});
        else if (wk.task) seq.push({...base, id:`${k}-w${w}-t`, kind:"task", title:`Week ${w} practice task`, min:75});
        seq.push({...base, id:`${k}-w${w}-q`, kind:"test", title:`Self-test: week ${w}`, min:20});
        projs.filter(p => p.anchor !== "start" && p.anchor[0] === k && p.anchor[1] === w).forEach(pushProj);
        if (w === c.weeks.length) seq.push({c:k, w, phase:pname, id:`${k}-final`, kind:"final", title:`Final self-exam: ${c.name}`, min:120});
      }
    }
  }
  cur = "Modern deep RL & capstone";
  for (const x of C.phase7.filter(x => track === "full" || x.core)){
    if (x.kind === "project") pushProj({...x, hours:x.size});
    else { const n = Math.ceil(x.size/60); for (let k = 1; k <= n; k++) seq.push({id:`${x.id}-s${k}`, kind:"ext", x, k, n, title:x.title, min:60, phase:cur}); }
  }
  seq.forEach(it => { if (it.kind === "task" && C.labmap[it.id]) it.lab = C.labmap[it.id]; if (it.kind === "proj" && C.labmap[it.p.id]) it.lab = C.labmap[it.p.id]; if (it.kind === "proj" && C.colab[it.p.id]) it.colab = C.colab[it.p.id]; });
  SEQ = seq; BYID = {}; seq.forEach(it => BYID[it.id] = it);
}
const totalMin = () => SEQ.reduce((a,it) => a + it.min, 0);
const doneMin = () => SEQ.reduce((a,it) => a + (S.done[it.id] ? it.min : 0), 0);

/* ---------- habits ---------- */
function habitsFor(date){
  if (dow(date) !== 0) return [];
  const n = Math.floor((parse(date) - parse(S.settings.start)) / 864e5 / 7);
  const h = [{id:`H-rev-${date}`, kind:"habit", title:"Weekly review: reread this week's notes, update your cheat sheet, push code to GitHub", min:30}];
  if (n % 4 === 3) h.push({id:`H-post-${date}`, kind:"habit", title:"Monthly write-up: publish a short post explaining one concept you learned", min:45});
  return h;
}
function habitById(id){ const m = id.match(/^H-(rev|post)-(\d{4}-\d\d-\d\d)$/); if (!m) return null; return habitsFor(m[2]).find(h => h.id === id) || {id, kind:"habit", title: m[1]==="rev" ? "Weekly review" : "Monthly write-up", min:30}; }
const getItem = id => BYID[id] || habitById(id);

/* ---------- scheduler ---------- */
function capFor(date){ const s = S.settings; if (s.rest.includes(dow(date))) return 0; if (s.mode === "deadline") return DAILY; const d = dow(date); return (d === 0 || d === 6) ? s.we : s.wd; }
const deadline = () => addDays(S.settings.start, S.settings.weeks*7 - 1);
function fitDeadline(){
  const s = S.settings, t = today(), begin = s.start > t ? s.start : t, end = deadline();
  let D = 0; for (let d = begin; d <= end; d = addDays(d, 1)) if (!s.rest.includes(dow(d))) D++;
  const R = SEQ.filter(it => !S.done[it.id]).reduce((a,it) => a + it.min, 0) + Math.ceil(D/7)*40;
  DAILY = Math.max(15, Math.ceil(R / Math.max(D,1) / 15) * 15);
  schedule();
  for (let k = 0; k < 40 && PLAN.end > end && DAILY < 1440; k++) { DAILY += 15; schedule(); }
}
function schedule(){
  const t = today(), s = S.settings;
  const days = new Map();
  const ensure = d => { if (!days.has(d)) days.set(d, []); return days.get(d); };
  // past and today's completed items
  for (const [id, d] of Object.entries(S.done)){ const it = getItem(id); if (it && (BYID[id] || id.startsWith("H-"))) ensure(d).push(it); }
  const remaining = SEQ.filter(it => !S.done[it.id]);
  let day = s.start > t ? s.start : t, i = 0, guard = 0;
  while (i < remaining.length && guard++ < 4000){
    let cap = capFor(day);
    if (day === t) cap -= (days.get(t) || []).reduce((a,it) => a + it.min, 0);
    const list = ensure(day);
    if (capFor(day) > 0) for (const h of habitsFor(day)) if (!S.done[h.id]) { list.push(h); cap -= h.min; }
    let used = 0;
    while (i < remaining.length && cap > 0){
      const it = remaining[i];
      if (it.min <= cap - used + 15 || used === 0) { list.push(it); used += it.min; i++; }
      else break;
      if (used >= cap) break;
    }
    day = addDays(day, 1);
  }
  const keys = [...days.keys()].filter(d => days.get(d).length).sort();
  const pos = {}; keys.forEach(d => days.get(d).forEach(it => { if (!S.done[it.id]) pos[it.id] = d; }));
  PLAN = {days, keys, pos, end: keys.length ? keys[keys.length-1] : t};
}

/* ---------- persistence ---------- */
let db = null, uid = null, progRef = null, notesRef = null, saveTimer = null, writing = Promise.resolve(), sample = null, dirtyS = false, dirtyN = false;
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify({s:S, n:NOTES})); } catch(e) {} }
function save(what = "s"){
  if (what === "s") { S.updated = Date.now(); dirtyS = true; } else { NOTES.updated = Date.now(); dirtyN = true; }
  saveLocal();
  if (!db || !uid) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const ps = dirtyS ? JSON.parse(JSON.stringify(S)) : null, ns = dirtyN ? JSON.parse(JSON.stringify(NOTES)) : null; dirtyS = dirtyN = false;
    writing = writing.then(() => ps && progRef.set(ps)).then(() => ns && notesRef.set(ns)).then(() => setSync("Synced to your Claude account")).catch(e => setSync(e && e.code === "quota_exceeded" ? "Sync storage is full; progress is saved in this browser" : "Sync failed; progress is saved in this browser"));
  }, 1200);
}
function setSync(m){ syncMsg = m; const el = $("#syncmsg"); if (el) el.textContent = m; }
async function connect(){
  try {
    for (let k = 0; k < 30 && !(window.claude && window.claude.use); k++) await new Promise(r => setTimeout(r, 100));
    if (!window.claude || !window.claude.use) { EMBED = true; setSync("Saved in this browser only. Use Copy progress backup to move your progress to another device."); softRender(); return; }
    claude.use("sample").then(s => { sample = s; if (s) softRender(); }).catch(() => {});
    db = await claude.use("db"); const user = await claude.use("user");
    uid = user ? await user.id() : null;
    if (!db || !uid) { db = null; return; }
    progRef = db.doc(`data/users/${uid}/progress`); notesRef = db.doc(`data/users/${uid}/notes`);
    const timer = setTimeout(() => setSync("Can't reach sync yet; progress is saved in this browser"), 10000);
    const [p, n] = await Promise.all([progRef.get(), notesRef.get()]);
    clearTimeout(timer);
    let changed = false;
    if (p.exists && (p.data().updated || 0) > (S.updated || 0)) { S = Object.assign(defaults(), JSON.parse(JSON.stringify(p.data()))); S.settings = Object.assign(defaults().settings, S.settings); changed = true; }
    if (n.exists && (n.data().updated || 0) > (NOTES.updated || 0)) { NOTES = JSON.parse(JSON.stringify(n.data())); changed = true; }
    if ((!p.exists && S.updated) || (p.exists && (p.data().updated||0) < S.updated)) save("s");
    if (!n.exists && NOTES.updated) save("n");
    setSync("Synced to your Claude account");
    if (changed) { saveLocal(); refresh(); }
    progRef.onSnapshot(snap => {
      if (!snap.exists || snap.metadata.hasPendingWrites) return;
      const d = snap.data(); if ((d.updated||0) > S.updated) { S = Object.assign(defaults(), JSON.parse(JSON.stringify(d))); S.settings = Object.assign(defaults().settings, S.settings); saveLocal(); refresh(); }
    }, () => setSync("Live sync stopped; reload to reconnect"));
  } catch(e) { db = null; setSync("Saved in this browser only"); }
}

function toggleDone(id, on){
  if (on) S.done[id] = today(); else delete S.done[id];
  save(); refresh();
}
function rateTest(id, conf){
  const t = S.tests[id] = Object.assign(S.tests[id] || {}, {conf, date:today()});
  S.done[id] = S.done[id] || today();
  scheduleReview(id, conf >= 4 && !(t.quiz && t.quiz.score/t.quiz.n < .7));
  save(); refresh();
}
function scheduleReview(id, good){
  const r = S.reviews[id] || {step:-1};
  if (!good) { S.reviews[id] = {step:0, due:addDays(today(), 2)}; return; }
  if (r.step < 0) { delete S.reviews[id]; return; }
  const gaps = [7, 21];
  if (r.step >= gaps.length) { delete S.reviews[id]; return; }
  S.reviews[id] = {step:r.step+1, due:addDays(today(), gaps[r.step])};
}
function reviewRate(id, conf){ scheduleReview(id, conf >= 4); S.tests[id] = Object.assign(S.tests[id] || {}, {conf, date:today()}); save(); refresh(); }

function labDoneMsg(){ return `<div class="notice">Lab complete. It's ticked off in your plan. Go back to <a href="#today">Today</a> for what's next.</div>`; }

const PY = {
  worker:null, ready:false, seq:0, pending:{}, at:{},
  start(){
    if (this.worker) return;
    const src = document.getElementById("pyworker").textContent;
    this.worker = new Worker(URL.createObjectURL(new Blob([src], {type:"text/javascript"})));
    this.worker.onmessage = e => { const m = e.data, p = this.pending[m.id]; if (!p) return; if (m.status) { pyStatus(m.status); return; } delete this.pending[m.id]; this.ready = true; pyStatus("Python ready"); p(m); };
    this.worker.onerror = e => { Object.values(this.pending).forEach(p => p({ok:false, out:"", err:"Python couldn't start: " + (e.message || "check your internet connection and press Restart Python.")})); this.pending = {}; };
  },
  exec(labId, code, opts = {}){
    this.start();
    const id = ++this.seq;
    return new Promise(res => { this.pending[id] = res; this.worker.postMessage({id, labId, code, packages:opts.packages || [], fresh:!!opts.fresh, grab:opts.grab !== false}); });
  },
  restart(){ if (this.worker) this.worker.terminate(); this.worker = null; this.ready = false; this.at = {}; Object.values(this.pending).forEach(p => p({ok:false, out:"", err:"Stopped."})); this.pending = {}; pyStatus("Python restarted"); },
  async prepare(lab, i){
    if (this.at[lab.id] === i) return {ok:true};
    const st = labState(lab.id);
    const prior = lab.steps.slice(0, i).map((sp, j) => st.p[j] && NOTES.n[codeKey(lab.id, j)] ? NOTES.n[codeKey(lab.id, j)] : sp.solution).join("\n\n");
    pyStatus(i ? `Running steps 1–${i} first…` : "Starting…");
    let r = await this.exec(lab.id, prior || "pass", {packages:lab.packages, fresh:true, grab:true});
    if (!r.ok && i) r = await this.exec(lab.id, lab.steps.slice(0, i).map(sp => sp.solution).join("\n\n"), {packages:lab.packages, fresh:true, grab:true});
    if (r.ok) this.at[lab.id] = i;
    return r;
  }
};
function pyStatus(m){ const el = $("#pystatus"); if (el) el.textContent = m; }
function friendly(err){
  const lines = String(err || "").trim().split("\n").filter(l => l.trim());
  let last = lines[lines.length - 1] || "Something went wrong.";
  const ln = [...String(err).matchAll(/File "<exec>", line (\d+)/g)].pop();
  if (/^AssertionError/.test(last)) return "Not quite yet: " + (last.replace(/^AssertionError:?\s*/, "") || "the check didn't pass.");
  if (/^NameError/.test(last)) last += ". A variable or function is used before it's defined, or a name is misspelt.";
  if (/^IndentationError|^SyntaxError/.test(last)) last += ". Check brackets, colons at the end of if/for/def lines, and indentation (4 spaces).";
  return (ln ? `Line ${ln[1]}: ` : "") + last;
}
async function labAction(sec, act){
  const id = location.hash.slice(5), lab = C.labs[id], i = +sec.dataset.step, sp = lab.steps[i];
  const ta = sec.querySelector("textarea"), out = sec.querySelector(".out"), figs = sec.querySelector(".figs");
  if (act === "hint") { sec.querySelector(".hint").hidden = false; return; }
  if (act === "sol") { sec.querySelector(".solbox").hidden = false; return; }
  if (act === "usesol" || act === "reset") { ta.value = act === "usesol" ? sp.solution : sp.starter; ta.rows = Math.min(28, ta.value.split("\n").length + 1); saveCode(id, i, ta.value); return; }
  const code = ta.value;
  if (code.includes("___")) { out.hidden = false; out.className = "out err"; out.textContent = "Replace every ___ with your own code first."; return; }
  sec.querySelectorAll("[data-lab-act]").forEach(b => b.disabled = true);
  out.hidden = false; out.className = "out"; out.textContent = "Running…"; figs.innerHTML = "";
  try {
    const pre = await PY.prepare(lab, i);
    if (!pre.ok) { out.className = "out err"; out.textContent = "Couldn't set up the earlier steps: " + friendly(pre.err); return; }
    const r = await PY.exec(id, code, {packages:lab.packages, grab: act !== "check"});
    PY.at[id] = i;
    let text = r.out || "";
    if (!r.ok) { out.className = "out err"; out.textContent = (text ? text + "\n\n" : "") + friendly(r.err); showFigs(figs, r.figs); return; }
    if (act === "run") { out.className = "out"; out.textContent = text || "Ran without errors. (Nothing was printed.)"; showFigs(figs, r.figs); return; }
    const c = await PY.exec(id, sp.check, {grab:true});
    showFigs(figs, c.figs);
    if (!c.ok) { out.className = "out err"; out.textContent = (text ? text + "\n\n" : "") + friendly(c.err); return; }
    PY.at[id] = i + 1;
    out.className = "out ok"; out.textContent = (text ? text + "\n\n" : "") + "Correct. " + (i + 1 < lab.steps.length ? "On to the next step." : "That's the last step.");
    passStep(id, i, sec);
  } finally { sec.querySelectorAll("[data-lab-act]").forEach(b => b.disabled = false); }
}
function showFigs(el, figs){ el.innerHTML = (figs || []).map(b => `<img alt="Plot output" src="data:image/png;base64,${b}">`).join(""); }
function saveCode(id, i, v){ NOTES.n[codeKey(id, i)] = v; clearTimeout(noteTimer); noteTimer = setTimeout(() => save("n"), 800); }
function passStep(id, i, sec){
  const st = labState(id), lab = C.labs[id];
  NOTES.n[codeKey(id, i)] = sec.querySelector("textarea").value; save("n");
  st.p[i] = true;
  sec.classList.add("passed");
  if (!sec.querySelector("h3 .pill")) sec.querySelector("h3").insertAdjacentHTML("beforeend", ` <span class="pill good">passed</span>`);
  const done = labPassed(id), n = lab.steps.length;
  $("#labbar").style.width = `${done/n*100}%`; $("#labcount").textContent = `${done}/${n} steps`;
  if (done === n) { SEQ.filter(it => it.lab === id && !S.done[it.id]).forEach(it => S.done[it.id] = today()); $("#labdone").innerHTML = labDoneMsg(); }
  save();
  buildSeq(); if (S.settings.mode === "deadline") fitDeadline(); else schedule(); updateStats();
  const nx = sec.nextElementSibling; if (nx && nx.classList.contains("step") && done < n) setTimeout(() => nx.scrollIntoView({behavior:"smooth", block:"start"}), 400);
}

async function quiz(it, box){
  const c = C.courses[it.c], final = it.kind === "final";
  const scope = final ? c.weeks.map(w => `Week ${w.n}${w.topic ? " (" + w.topic + ")" : ""}: ${w.lectures.map(l => l[0]).join("; ")}`).join("\n") : `Week ${it.w}${c.weeks[it.w-1].topic ? " (" + c.weeks[it.w-1].topic + ")" : ""}: ${weekLectures(it.c, it.w).join("; ")}`;
  const n = final ? 10 : 5;
  box.innerHTML = `<p class="note">Writing ${n} questions…</p>`;
  try {
    const out = await sample.json(`You are an examiner for the NPTEL course "${c.title}" (${c.prof}, ${c.inst}). Write ${n} multiple-choice questions that test conceptual understanding and simple calculation for this material, at the level of the course's weekly assignments. Avoid trivia about the lecturer or course logistics.\n\nMaterial:\n${scope}\n\nReturn only JSON: {"questions":[{"q":"question text","options":["A","B","C","D"],"answer":0,"why":"one or two sentence explanation"}]} where answer is the index of the correct option. Use plain text math (e.g. V(s) = max_a sum_s' P(s'|s,a)[r + gamma V(s')]).`, {modelTier:"default"});
    const qs = (out && out.questions || []).filter(q => q && q.q && Array.isArray(q.options) && Number.isInteger(q.answer));
    if (!qs.length) throw {message:"no questions"};
    let answered = 0, right = 0;
    box.innerHTML = qs.map((q,i) => `<div class="q" data-q="${i}"><p>${i+1}. ${esc(q.q)}</p><div class="opts">${q.options.map((o,j) => `<button data-j="${j}">${esc(o)}</button>`).join("")}</div><div class="why" hidden>${esc(q.why || "")}</div></div>`).join("") + `<p class="note" data-score></p>`;
    box.querySelectorAll(".q").forEach(qe => qe.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b || qe.dataset.done) return;
      const q = qs[+qe.dataset.q], j = +b.dataset.j; qe.dataset.done = 1; answered++;
      if (j === q.answer) { right++; b.classList.add("right"); } else { b.classList.add("wrong"); qe.querySelectorAll("button")[q.answer].classList.add("right"); }
      qe.querySelector(".why").hidden = false;
      if (answered === qs.length) {
        box.querySelector("[data-score]").textContent = `Score: ${right}/${qs.length}. Saved.`;
        const t = S.tests[it.id] = Object.assign(S.tests[it.id] || {}, {quiz:{score:right, n:qs.length, date:today()}, date:today()});
        if (!final && right/qs.length < .7) S.reviews[it.id] = {step:0, due:addDays(today(), 2)};
        save();
      }
    }));
  } catch(e) {
    if (e && e.code === "not_granted") { sample = null; box.innerHTML = ""; return; }
    box.innerHTML = `<p class="note">${e && e.code === "rate_limited" ? "Claude is busy right now. Try again in a minute." : "Couldn't generate a quiz this time. Try again."}</p>`;
  }
}
async function ask(it, ta, out){
  const qn = ta.value.trim(); if (!qn) return;
  const c = it.c ? C.courses[it.c] : null, wk = c && it.w ? c.weeks[it.w-1] : null;
  const ctx = it.kind === "lec" ? `the lecture "${it.title}" (week ${it.w}${wk.topic ? ", " + wk.topic : ""}) of the NPTEL course "${c.title}" by ${c.prof}` : it.kind === "task" ? `this practice task from week ${it.w} of "${c.title}": ${wk.task}` : `"${it.title}"`;
  out.hidden = false; out.textContent = "Thinking…";
  try {
    await sample(`I'm a data engineer learning machine learning and reinforcement learning in depth. I'm working on ${ctx}.\n\nMy question: ${qn}\n\nAnswer clearly in short paragraphs. Use plain-text math where it helps and a small worked example if useful. If a coding hint helps, give a short Python snippet. Don't solve an entire assignment for me; guide me instead.`, {onText: ({text}) => { out.textContent = text; }, cache:false});
  } catch(e) {
    if (e && e.code === "not_granted") { sample = null; out.textContent = ""; out.hidden = true; return; }

  if (e.target.matches("textarea.code")) { const sec = e.target.closest(".step"); saveCode(location.hash.slice(5), +sec.dataset.step, e.target.value); return; }
  if (!e.target.matches('textarea[data-act="note"]')) return;
  const id = e.target.closest("[data-id]").dataset.id, v = e.target.value;
  if (v) NOTES.n[id] = v; else delete NOTES.n[id];
  clearTimeout(noteTimer); noteTimer = setTimeout(() => save("n"), 800);
});
window.addEventListener("hashchange", () => { open.clear(); render(); window.scrollTo(0,0); });
function firstRender(){ render(); }

/* ---------- boot ---------- */
fetch("curriculum.json").then(r => r.json()).then(data => {
  C = data; refresh(); if (location.hash.startsWith("#lab-")) render(); connect();
  setInterval(() => { const t = today(); if (t !== window.__d) { window.__d = t; refresh(); } }, 60000); window.__d = today();
}).catch(() => { $("#view").innerHTML = `<p class="empty">Couldn't load the curriculum file. Reload the page to try again.</p>`; });
</script>
